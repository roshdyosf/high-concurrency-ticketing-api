services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ticketing_app
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan serve --host=0.0.0.0 --port=8000
        environment:
            PHP_CLI_SERVER_WORKERS: 4
        volumes:
            - .:/var/www
        ports:
            - "8000:8000"
        networks:
            - ticketing_network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    scheduler:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ticketing_scheduler
        restart: unless-stopped
        working_dir: /var/www
        command: php artisan schedule:work
        volumes:
            - .:/var/www
        networks:
            - ticketing_network
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:17
        container_name: ticketing_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-ticketing_db}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - ticketing_network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-ticketing_db}",
                ]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: ticketing_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        networks:
            - ticketing_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    mailpit:
        image: axllent/mailpit:latest
        container_name: ticketing_mailpit
        restart: unless-stopped
        ports:
            - "8025:8025"
            - "1025:1025"
        networks:
            - ticketing_network
    stripe-cli:
        image: stripe/stripe-cli:latest
        container_name: ticketing_stripe_cli
        profiles: ["stripe"]
        command: >
            listen
            --api-key ${STRIPE_SECRET}
            --events payment_intent.succeeded,payment_intent.payment_failed,charge.refunded,refund.updated
            --forward-to http://app:8000/api/v1/webhooks/stripe
        networks:
            - ticketing_network
        depends_on:
            - app
networks:
    ticketing_network:
        driver: bridge

volumes:
    postgres_data:
    redis_data:
